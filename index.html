<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="description" content="Tallinn prayer times — next prayer and today's schedule." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tallinn Prayer Times</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-left">
        <span class="city">Tallinn</span>
        <span class="sep" aria-hidden="true">·</span>
        <span class="date-line" id="dateLine">—</span>
      </div>
      <span class="offline-pill" id="offlinePill" hidden>offline</span>
    </header>

    <section class="hero" id="hero" aria-live="polite">
      <div class="skeleton hero-skel" id="heroSkeleton">
        <div class="sk sk-label"></div>
        <div class="sk sk-name"></div>
        <div class="sk sk-time"></div>
        <div class="sk sk-countdown"></div>
      </div>
      <div class="hero-content" id="heroContent" hidden>
        <div class="next-label">Next</div>
        <div class="next-name-row">
          <h1 class="next-name" id="nextName">—</h1>
          <span class="chip tomorrow-chip" id="tomorrowChip" hidden>tomorrow</span>
        </div>
        <div class="next-time" id="nextTime">—:—</div>
        <div class="next-countdown" id="nextCountdown">—</div>
      </div>
    </section>

    <section class="today" aria-label="Today's prayer times">
      <ul class="prayer-list" id="prayerList">
        <li class="prayer-row skeleton-row"><span class="sk sk-row-name"></span><span class="sk sk-row-time"></span></li>
        <li class="prayer-row skeleton-row"><span class="sk sk-row-name"></span><span class="sk sk-row-time"></span></li>
        <li class="prayer-row skeleton-row"><span class="sk sk-row-name"></span><span class="sk sk-row-time"></span></li>
        <li class="prayer-row skeleton-row"><span class="sk sk-row-name"></span><span class="sk sk-row-time"></span></li>
        <li class="prayer-row skeleton-row"><span class="sk sk-row-name"></span><span class="sk sk-row-time"></span></li>
      </ul>
    </section>

    <footer class="footer">
      <a class="footer-link" href="month.html">This month</a>
    </footer>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
