<!DOCTYPE html>
<html lang="en" class="month-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="description" content="Tallinn prayer times for this month." />
  <title>This month · Tallinn Prayer Times</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      var android = /Android/i.test(navigator.userAgent);
      var standalone = window.matchMedia("(display-mode: standalone)").matches
        || window.matchMedia("(display-mode: fullscreen)").matches
        || window.matchMedia("(display-mode: minimal-ui)").matches
        || window.navigator.standalone === true;
      var root = document.documentElement;
      var vv = window.visualViewport;
      var h = vv && vv.height > 0 ? vv.height : window.innerHeight;
      root.style.setProperty("--app-vh", Math.round(h) + "px");
      root.style.setProperty("--sab-floor", android && standalone ? "48px" : "0px");
    })();
  </script>
</head>
<body class="month-page">
  <div class="app month-app">
    <header class="month-header">
      <span class="month-header-spacer" aria-hidden="true"></span>
      <div class="month-title-block">
        <h1 class="month-title" id="monthTitle">—</h1>
        <p class="month-sub">Tallinn</p>
      </div>
      <div class="month-nav">
        <button type="button" class="nav-btn" id="prevMonth" aria-label="Previous month">‹</button>
        <button type="button" class="nav-btn" id="nextMonth" aria-label="Next month">›</button>
      </div>
    </header>

    <p class="month-scroll-hint" id="monthScrollHint">Swipe sideways for Maghrib &amp; Isha →</p>

    <div class="month-grid-wrap" id="monthGridWrap">
      <div class="month-labels" aria-hidden="true">
        <span class="col-day">Day</span>
        <span class="col-wd">Wd</span>
        <span>Fajr</span>
        <span>Dhuhr</span>
        <span>Asr</span>
        <span>Maghrib</span>
        <span>Isha</span>
      </div>
      <table class="month-grid" id="monthGrid">
        <thead class="sr-only">
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Weekday</th>
            <th scope="col">Fajr</th>
            <th scope="col">Dhuhr</th>
            <th scope="col">Asr</th>
            <th scope="col">Maghrib</th>
            <th scope="col">Isha</th>
          </tr>
        </thead>
        <tbody id="monthBody">
          <tr><td colspan="7" class="loading-cell">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="index.html">
        <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 7.5v4.75l3 1.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tab-label">Today</span>
      </a>
      <a class="tab is-active" href="month.html" aria-current="page">
        <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="tab-label">Month</span>
      </a>
    </nav>
  </div>
  <script type="module" src="js/month.js"></script>
</body>
</html>
